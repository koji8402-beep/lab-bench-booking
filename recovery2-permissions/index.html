<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>復元試験・他の利用者の希望</title><style>body{font-family:system-ui,sans-serif;background:#f4f7f5;color:#203431;margin:0;padding:24px}main{max-width:560px;margin:40px auto;background:white;padding:24px;border-radius:14px}button{background:#246b58;color:white;border:0;border-radius:8px;padding:12px 16px;font-size:16px}button:disabled{opacity:.55}p{line-height:1.7}</style></head><body><main><h1>他の利用者の希望の権限確認</h1><p>復元試験先の架空の希望１件を使用します。ご本人のアカウントから、時間変更と取消が拒否されるか確認します。</p><button id="signIn">Googleでログイン</button><button id="test" hidden>アクセス制限を確認</button><p id="status" role="status">これまでと同じGoogleアカウントでログインしてください。</p><p>通常の予約データは変更しません。</p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
import {getFirestore,doc,getDocFromServer,updateDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyAzi7KjNcxAYLiQw3-tJb4Rk1-i9mM4E_o',authDomain:'lab-bench-recovery2-8402.firebaseapp.com',projectId:'lab-bench-recovery2-8402',appId:'1:7722922934:web:006328399d22d813394717'});const auth=getAuth(app),db=getFirestore(app),status=document.querySelector('#status'),signin=document.querySelector('#signIn'),button=document.querySelector('#test');
signin.onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){status.textContent='ログインできませんでした：'+(e.code||'エラー')}};
onAuthStateChanged(auth,user=>{if(user){signin.hidden=true;button.hidden=false;status.textContent='ログインしました。「アクセス制限を確認」を押してください。'}});
button.onclick=async()=>{button.disabled=true;status.textContent='確認中です…';try{const user=auth.currentUser;if(!user)throw Error('ログインが必要です。');const ref=doc(db,'v2Requests','synthetic-other-permission-test'),before=await getDocFromServer(ref);if(!before.exists())throw Error('仮希望が見つかりません。');const data=before.data();if(data.ownerUid!=='synthetic-other-account'||data.ownerUid===user.uid||data.start!=='10:00'||data.end!=='11:00'||data.cancelled!==false)throw Error('仮希望が想定した状態ではありません。');
 async function rejected(payload){try{await updateDoc(ref,payload);return false}catch(e){if(e.code==='permission-denied')return true;throw e}}
 const editDenied=await rejected({end:'11:30',updatedAt:serverTimestamp()});if(!editDenied)throw Error('時間変更が拒否されませんでした。');const cancelDenied=await rejected({cancelled:true,cancelledAt:serverTimestamp()});if(!cancelDenied)throw Error('取消が拒否されませんでした。');const after=(await getDocFromServer(ref)).data();if(after.ownerUid!==data.ownerUid||after.start!=='10:00'||after.end!=='11:00'||after.cancelled!==false)throw Error('試験データの状態が変わりました。');status.textContent='確認できました。別の利用者の希望の時間変更と取消は拒否され、仮希望は変わっていません。'}catch(e){status.textContent='確認できませんでした：'+(e.message||e.code||'エラー')}finally{button.disabled=false}};
</script></body></html>
