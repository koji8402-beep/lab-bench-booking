<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>別プロジェクトでの復元ログイン確認</title><style>body{font-family:system-ui,sans-serif;background:#f4f7f5;color:#203431;margin:0;padding:24px}main{max-width:560px;margin:40px auto;background:#fff;padding:24px;border-radius:14px}button{background:#246b58;color:white;border:0;border-radius:8px;padding:12px 16px;font-size:16px}p{line-height:1.7}</style></head><body><main><h1>別プロジェクトでのログイン確認</h1><p>復元試験専用の画面です。普段の予約データには接続しません。</p><button id="signIn">Googleでログイン</button><p id="status">ログインして確認してください。</p><p>パスワードや認証コードを他の人に伝える必要はありません。</p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
import {getFirestore,doc,getDocFromServer} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyAzi7KjNcxAYLiQw3-tJb4Rk1-i9mM4E_o',authDomain:'lab-bench-recovery2-8402.firebaseapp.com',projectId:'lab-bench-recovery2-8402',appId:'1:7722922934:web:006328399d22d813394717'});
const auth=getAuth(app),status=document.querySelector('#status'),button=document.querySelector('#signIn');
button.onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){status.textContent='ログインできませんでした：'+(e.code||'エラー')}};
onAuthStateChanged(auth,async user=>{if(!user)return;button.hidden=true;status.textContent='ログインしました。アクセス制限を確認しています…';try{await getDocFromServer(doc(getFirestore(app),'v2Members','synthetic-check'));status.textContent='アクセス制限の確認で想定外の結果になりました。担当者にお知らせください。'}catch(e){status.textContent=e.code==='permission-denied'?'Googleログインに成功し、試験データへのアクセスが拒否されました。担当者にお知らせください。':'アクセス制限を確認できませんでした：'+(e.code||'エラー')}});
</script></body></html>
